[pytest]
testpaths = test/white_box
python_files = test_*.py
addopts = 
    -v
    --cov=test/white_box
    --cov=data_scraping
    --cov-branch
    --cov-report=term-missing
    --ignore-glob=test/white_box/run_coverage_engine.py

[run]
branch = True
omit =
    test/white_box/conftest.py
    test/white_box/**/test_*.py
    test/white_box/run_coverage_engine.py
    data_scraping/tutor_scraper.py
    **/__init__.py

[report]
show_missing = True
fail_under = 100
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    raise NotImplementedError
    pass
