name: SonarCloud Analysis

on:
  push:
    branches:
      - develop
      - baodevelop
      - thudevelop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Cần full history để SonarCloud phân tích blame & new code

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Tự động có sẵn, dùng để comment PR
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Token bạn thêm vào GitHub Secrets
          SONAR_HOST_URL: https://sonarcloud.io     # Bắt buộc với action mới
