# =============================================
# SonarCloud Configuration — tutor-management
# =============================================

# Thông tin project (lấy từ SonarCloud dashboard)
sonar.projectKey=HuynhhBao_tutor-management
sonar.organization=huynhhbao
sonar.projectName=tutor-management
sonar.host.url=https://sonarcloud.io

# Quét cả backend (Node.js) lẫn frontend (React)
sonar.sources=backend,frontend/src

# Bỏ qua các thư mục không cần scan
sonar.exclusions=\
  **/node_modules/**, \
  **/dist/**, \
  **/build/**, \
  **/uploads/**, \
  **/coverage/**, \
  **/*.test.js, \
  **/*.spec.js, \
  **/*.test.jsx, \
  **/*.spec.jsx, \
  frontend/public/**

# File extensions cần scan
sonar.javascript.file.suffixes=.js,.jsx

# Encoding

sonar.sourceEncoding=UTF-8
