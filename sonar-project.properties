# =============================================
# SonarCloud Configuration — tutor-management
# =============================================

# Thông tin project
sonar.projectKey=HuynhhBao_tutor-management
sonar.organization=huynhhbao
sonar.projectName=tutor-management
sonar.host.url=https://sonarcloud.io

# Nguồn quét
sonar.sources=backend,frontend/src

# 1. LOẠI BỎ HOÀN TOÀN KHỎI QUÉT (Không scan bugs/security cho các thư mục này)
sonar.exclusions=\
  **/node_modules/**, \
  **/dist/**, \
  **/build/**, \
  **/uploads/**, \
  **/coverage/**, \
  
  frontend/public/**

sonar.coverage.exclusions=**/*

sonar.cpd.exclusions=**/*

# Cấu hình ngôn ngữ
sonar.javascript.file.suffixes=.js,.jsx


sonar.sourceEncoding=UTF-8


